# Fail2ban filter for FreeSWITCH SIP Digest Authentication Failures
[INCLUDES]
before = common.conf

[Definition]
_daemon = freeswitch

failregex = \[WARNING\] sofia_reg\.c:\d+ SIP auth failure \((REGISTER|INVITE)\) on sofia profile \'[^']+\' for \[[^\]]*\] from ip <HOST>
            \[WARNING\] sofia_reg\.c:\d+ Can't find user \[[^\]]*\] from <HOST>
            \[WARNING\] sofia_reg\.c:\d+ Auth failure \((REGISTER|INVITE)\) .* from ip <HOST>

ignoreregex =
