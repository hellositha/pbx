; ==========================================================
; Eclype Technology PBX - PJSIP External SIP Carrier Trunks
; ==========================================================

[Main-SIP-Trunk]
type=endpoint
context=from-pstn
disallow=all
allow=ulaw,alaw,g722
transport=transport-udp
outbound_auth=Main-SIP-Trunk-auth
aors=Main-SIP-Trunk-aor
direct_media=no

[Main-SIP-Trunk-aor]
type=aor
contact=sip:sip.eclypecarrier.net:5060

[Main-SIP-Trunk-auth]
type=auth
auth_type=userpass
username=eclype_trunk
password=EclypeTrunkPass123!

