; ==========================================================
; Eclype Technology PBX - Master Dialplan Configuration
; Telephony Engine: Asterisk 22 LTS
; ==========================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
CONSOLE=Console/dsp

; Internal Extension Routing & Feature Codes
[from-internal]
; Extension to Extension (1000 - 1999)
exten => _1XXX,1,NoOp(Eclype PBX Call from ${CALLERID(all)} to ${EXTEN})
 same => n,Set(CDR(accountcode)=${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN},30,tTkK)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unavail)
 same => n(busy),VoiceMail(${EXTEN}@default,b)
 same => n,Hangup()
 same => n(unavail),VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()

; Echo Audio Test (*43)
exten => *43,1,NoOp(Eclype PBX WebRTC / SIP Audio Echo Test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Echo()
 same => n,Hangup()

; My Voicemail Access (*97)
exten => *97,1,NoOp(Eclype PBX Voicemail Portal)
 same => n,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; General Voicemail Access (*98)
exten => *98,1,NoOp(Eclype PBX General Voicemail Login)
 same => n,Answer()
 same => n,VoiceMailMain(@default)
 same => n,Hangup()

; Outbound Calling with Prefix 9
exten => _9.,1,NoOp(Eclype PBX Outbound Call to PSTN: ${EXTEN:1})
 same => n,Dial(PJSIP/${EXTEN:1}@Main-SIP-Trunk,60,W)
 same => n,Hangup()

; Inbound PSTN Carrier Context
[from-pstn]
exten => s,1,NoOp(Inbound Call from Carrier Trunk to ${EXTEN})
 same => n,Answer()
 same => n,Dial(PJSIP/1001&PJSIP/1010,25,tT)
 same => n,VoiceMail(1001@default,u)
 same => n,Hangup()

exten => _X.,1,NoOp(Inbound DID ${EXTEN} received)
 same => n,Dial(PJSIP/1001&PJSIP/1010,25,tT)
 same => n,Hangup()
