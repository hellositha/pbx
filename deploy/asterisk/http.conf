; Asterisk Built-in HTTP / WebSocket Server
[general]
servername=Eclype Technology PBX (Asterisk 22)
enabled=yes
bindaddr=0.0.0.0
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/asterisk.crt
tlsprivatekey=/etc/asterisk/keys/asterisk.key
sessionlimit=200
session_inactivity=30000
session_keep_alive=15000
