; ==========================================================
; Eclype Technology PBX - PJSIP Extension Endpoints
; ==========================================================

; WebRTC Client Template (Used for browser softphones)
[webrtc-endpoint](!)
type=endpoint
context=from-internal
disallow=all
allow=opus,ulaw,alaw,g722
webrtc=yes
dtls_auto_generate_cert=no
dtls_cert_file=/etc/asterisk/keys/asterisk.crt
dtls_private_key=/etc/asterisk/keys/asterisk.key
dtls_setup=actpass
dtls_verify=fingerprint
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
use_avpf=yes
media_encryption=dtls
direct_media=no
force_rport=yes
rewrite_contact=yes
device_state_busy_at=1
max_audio_streams=1

; Standard Deskphone Template (SIP UDP/TCP)
[deskphone-endpoint](!)
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw,g722,opus
direct_media=no
force_rport=yes
rewrite_contact=yes
device_state_busy_at=1
max_audio_streams=1

; ----------------------------------------------------------
; Extension 1001 (Alice Smith / Admin)
; ----------------------------------------------------------
[1001](webrtc-endpoint)
auth=1001
aors=1001
callerid="Alice Smith" <1001>
mailboxes=1001@default

[1001]
type=auth
auth_type=userpass
username=1001
password=EclypeExt1001!

[1001]
type=aor
max_contacts=5
remove_existing=yes

